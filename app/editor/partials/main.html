<!-- empty state -->
<div id="empty-state">open or create a project to get started</div>

<!-- view mode toggle bar (Edit / Split / Preview) -->
<div id="view-bar">
  <button class="view-btn" id="vbtn-edit"    onclick="setViewMode('edit')">Edit</button>
  <button class="view-btn active" id="vbtn-split" onclick="setViewMode('split')">Split</button>
  <button class="view-btn" id="vbtn-preview" onclick="setViewMode('preview')">Preview</button>
</div>

<!-- work area -->
<div id="work-area" class="mode-split">

  <!-- edit pane -->
  <div id="edit-pane">
    <!-- body editor — Quill mounts here -->
    <div id="body-editor"></div>

    <!-- save bar -->
    <div id="save-bar">
      <button onclick="doSave()">Save</button>
      <span id="save-status"></span>
    </div>
  </div><!-- /edit-pane -->

  <!-- preview pane -->
  <div id="preview-pane">
    <div id="preview-label">Live Preview</div>
    <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>

</div><!-- /work-area -->

<!-- config form (shown when config.json is opened) -->
<div id="config-form">
  <div id="config-form-header">Project Config</div>
  <div id="config-form-fields">
    <label>Site Title
      <input id="cfg-siteTitle" type="text" oninput="onConfigInput()" />
    </label>
    <label>Site Prompt
      <input id="cfg-sitePrompt" type="text" oninput="onConfigInput()" />
    </label>
    <label>Site Description
      <input id="cfg-siteDesc" type="text" oninput="onConfigInput()" />
    </label>
    <label>Current Year
      <input id="cfg-currentYear" type="text" oninput="onConfigInput()" />
    </label>
    <label>Site URL
      <input id="cfg-siteUrl" type="text" oninput="onConfigInput()" />
    </label>
    <label>Author
      <input id="cfg-author" type="text" oninput="onConfigInput()" />
    </label>
  </div>
  <div id="config-form-status"></div>
</div>

<!-- post settings form (shown when article Settings is clicked) -->
<div id="post-settings-form">
  <div id="post-settings-header">Post Settings</div>
  <div id="post-settings-fields">
    <label>Title
      <input id="field-title" type="text" oninput="onMetaChange()" />
    </label>
    <label>Description
      <input id="field-desc" type="text" oninput="onMetaChange()" />
    </label>
    <label>Date
      <input id="field-date" type="date" oninput="onMetaChange()" />
    </label>
    <label>Tags (comma-sep)
      <input id="field-tags" type="text" oninput="onMetaChange()" />
    </label>
    <label>Read time
      <input id="field-readtime" type="text" oninput="onMetaChange()" />
    </label>
    <label>Pinned
      <input id="field-pinned" type="checkbox" onchange="onMetaChange()" />
    </label>
    <label>Pinned order
      <input id="field-pinned-order" type="text" style="width:60px;" oninput="onMetaChange()" />
    </label>
  </div>
  <div id="post-settings-status"></div>
</div>

<!-- app config form -->
<div id="app-config-form">
  <div id="app-config-form-header">App Config</div>
  <div id="app-config-form-fields">
    <label>App Data Directory
      <input id="acfg-userDataPath" type="text" readonly />
    </label>
    <label>Developer Tools
      <input id="acfg-devTools" type="checkbox" onchange="onAppConfigInput()" />
    </label>
    <label>Default Project Directory
      <div class="picker-field">
        <input id="acfg-defaultProjectDir" type="text" oninput="onAppConfigInput()" />
        <button class="pick-btn" onclick="pickAppConfigDir()" title="Browse">&#128193;</button>
      </div>
    </label>
    <label>Auto Save
      <input id="acfg-autoSave" type="checkbox" onchange="onAppConfigInput()" />
    </label>
    <label>Auto Save Delay (ms)
      <input id="acfg-autoSaveDelay" type="number" min="500" step="100" oninput="onAppConfigInput()" />
    </label>
    <label>Build on Save
      <input id="acfg-buildOnSave" type="checkbox" onchange="onAppConfigInput()" />
    </label>
  </div>
  <div id="app-config-form-status"></div>
</div>

<!-- raw / config editor (shown instead of work-area for config files) -->
<textarea id="raw-editor" placeholder=""></textarea>
