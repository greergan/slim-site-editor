<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slim site editor</title>
      <link rel="stylesheet" href="css/editor.css" />
</head>
<body>

<!-- topbar -->
<div id="topbar">
  <button id="menu-toggle" onclick="toggleSidebar()" title="Toggle sidebar">&#9776;</button>
  <span id="app-name" style="font-size:13px;color:#569cd6;font-weight:bold;"></span>
  <span style="color:#555;">|</span>
  <span id="project-name">— no project —</span>
  <div id="topbar-actions">
    <button class="topbar-btn" id="btn-save"  onclick="doSave()"  disabled>Save</button>
    <button class="topbar-btn" id="btn-build" onclick="doBuild()" disabled>Build</button>
    <span id="status">ready</span>
  </div>
</div>

<!-- body row -->
<div id="body-row">

  <!-- sidebar -->
  <div id="sidebar">

    <!-- PROJECTS -->
    <div class="sidebar-section-header open" onclick="toggleSection(this)">
      <span>Projects</span>
      <span class="arrow">&#9658;</span>
    </div>
    <div class="sidebar-section-body open" id="projects-section">

      <!-- project accordion rows injected here by loadProjects() -->

      <!-- New Project -->
      <button class="sidebar-action top-level" onclick="togglePickerRow('new-project-row')">+ New Project</button>
      <div class="picker-row" id="new-project-row">
        <label style="font-size:11px;color:#888;">Parent directory</label>
        <div class="picker-field">
          <input id="new-project-parent" type="text" placeholder="e.g. /home/user/sites" />
          <button class="pick-btn" onclick="pickDir('new-project-parent')" title="Browse">&#128193;</button>
        </div>
        <label style="font-size:11px;color:#888;">Project name</label>
        <input id="new-project-name" type="text" placeholder="My Blog" />
        <div class="picker-row-actions">
          <button onclick="doNewProject()">Create</button>
        </div>
      </div>

      <!-- Import Project -->
      <button class="sidebar-action top-level" onclick="togglePickerRow('import-row')">+ Import Project</button>
      <div class="picker-row" id="import-row">
        <label style="font-size:11px;color:#888;">Project directory</label>
        <div class="picker-field">
          <input id="import-input" type="text" placeholder="e.g. /home/user/sites/my-blog" />
          <button class="pick-btn" onclick="pickDir('import-input')" title="Browse">&#128193;</button>
        </div>
        <div class="picker-row-actions">
          <button onclick="doImport()">Import</button>
        </div>
      </div>

    </div>

    <!-- PROJECT CONFIG -->
    <div class="sidebar-section-header" onclick="toggleSection(this)">
      <span>Project Config</span>
      <span class="arrow">&#9658;</span>
    </div>
    <div class="sidebar-section-body" id="project-config-section">
      <div class="config-nav-item" id="nav-project-config" onclick="openProjectConfig()">config.json</div>
    </div>

  </div><!-- /sidebar -->

  <!-- main area -->
  <div id="main">

    <!-- empty state -->
    <div id="empty-state">open or create a project to get started</div>

    <!-- view mode toggle bar (Edit / Split / Preview) -->
    <div id="view-bar">
      <button class="view-btn" id="vbtn-edit"    onclick="setViewMode('edit')">Edit</button>
      <button class="view-btn active" id="vbtn-split" onclick="setViewMode('split')">Split</button>
      <button class="view-btn" id="vbtn-preview" onclick="setViewMode('preview')">Preview</button>
    </div>

    <!-- work area -->
    <div id="work-area" class="mode-split">

      <!-- edit pane -->
      <div id="edit-pane">
        <div id="meta-fields">
          <label>Title
            <input id="field-title" type="text" oninput="onMetaChange()" />
          </label>
          <label>Description
            <input id="field-desc" type="text" oninput="onMetaChange()" />
          </label>
          <label>Date
            <input id="field-date" type="date" oninput="onMetaChange()" />
          </label>
          <label>Tags (comma-sep)
            <input id="field-tags" type="text" oninput="onMetaChange()" />
          </label>
          <label>Read time
            <input id="field-readtime" type="text" oninput="onMetaChange()" />
          </label>
          <label>Pinned
            <input id="field-pinned" type="checkbox" onchange="onMetaChange()" />
          </label>
          <label>Pinned order
            <input id="field-pinned-order" type="text" style="width:60px;" oninput="onMetaChange()" />
          </label>
        </div>

        <!-- body editor -->
        <textarea id="body-editor" placeholder="Post body (HTML)..." oninput="onBodyInput()"></textarea>

        <!-- save bar -->
        <div id="save-bar">
          <button onclick="doSave()">Save</button>
          <span id="save-status"></span>
        </div>
      </div><!-- /edit-pane -->

      <!-- preview pane -->
      <div id="preview-pane">
        <div id="preview-label">Live Preview</div>
        <div id="preview-content"></div>
      </div>

    </div><!-- /work-area -->

    <!-- raw / config editor (shown instead of work-area for config files) -->
    <textarea id="raw-editor" placeholder=""></textarea>

  </div><!-- /main -->

</div><!-- /body-row -->

<!-- error modal -->
<div id="error-modal-overlay">
  <div id="error-modal">
    <div id="error-modal-title">Error</div>
    <div id="error-modal-msg"></div>
    <button id="error-modal-ok" onclick="hideError()">OK</button>
  </div>
</div>

  <script src="js/editor.js"></script>

</body>
</html>
